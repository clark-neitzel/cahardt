];
const seed=()=>({screen:'hoje',view:'mobile',client:'Mercado Jardim',channel:'WhatsApp',result:'',revision:'Pediu uma pausa',agenda:'Atrasados',leadFilter:'Em acompanhamento',done:[],reviewed:false,events:[],tasks:[{id:1,name:'Padaria Primavera',text:'Confirmar interesse após a amostra',when:'Atrasados',date:'Vencido há 2 dias'},{id:2,name:'Empório da Praça',text:'Revisar uma pausa combinada',when:'Atrasados',date:'Vencido há 1 dia'},{id:3,name:'Mercado Jardim',text:'Falar com a responsável pelas compras',when:'Hoje',date:'Hoje, à tarde'},{id:4,name:'Café Estação',text:'Apresentar os produtos e preços',when:'Próximos',date:'Terça, 27/10'}],leads:[],currentTask:null});
let state=seed(),toastTimer;
const nav=(id,client)=>{state.screen=id;if(client)state.client=client;location.hash=id;render();document.getElementById('screen-nav').classList.remove('open');document.getElementById('mobile-menu').setAttribute('aria-expanded','false');document.querySelector('.workspace').scrollIntoView({block:'start'})};
function notify(s){const el=document.getElementById('toast');el.textContent=s;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,4500)}
const btn=(label,action,cls='',attrs='')=>`<button type="button" class="btn ${cls}" data-action="${action}" ${attrs}>${label}</button>`;
const title=(text,sub='',extra='')=>`<div class="app-title"><div><h3>${text}</h3><p>${sub}</p></div>${extra}</div>`;
const badge=(text,color='')=>`<span class="badge ${color}">${text}</span>`;
const radio=(name,values,selected,vertical=false)=>`<div class="choices ${vertical?'vertical':''}">${values.map(v=>`<label class="choice"><input type="radio" name="${name}" value="${esc(v)}" ${v===selected?'checked':''}><span>${esc(v)}</span></label>`).join('')}</div>`;
const notice=(text,kind='soft')=>`<div class="notice ${kind}">${icon(kind==='info'?'box':'clock')}<span>${text}</span></div>`;
function orderContext(){return `<div class="order-context"><strong>${icon('box')} Pedido feito ontem · #1234</strong><div class="detail"><span>R$ 480,00 · WhatsApp</span><span>22/10</span></div><div class="detail"><span>Entrega mantida</span><b>Sexta, 23/10</b></div><button class="btn link" data-action="order">Conferir pedido ${icon('arrow')}</button></div>`}
function route(){const clients=[{name:'Mercado Jardim',reason:'Rota de sexta · retorno combinado hoje',recent:true},{name:'Padaria Primavera',reason:'Rota de sexta · atendimento presencial',risk:'16 dias sem comprar · ciclo de 7 dias'},{name:'Mercearia do Lago',reason:'Rota de sexta · WhatsApp'}].filter(c=>!state.done.includes(c.name));return title('Minha rota','Sexta, 23 de outubro')+`<div class="tabs"><button class="on" data-screen="hoje">Hoje</button><button data-screen="atividade">Atividade</button><button data-screen="agenda">Agenda</button></div><button class="notice" data-screen="agenda">${icon('clock')}<span class="grow"><b>${state.tasks.filter(t=>t.when==='Atrasados').length} pendências anteriores</b><br>Revisar sem interromper a rota de hoje</span>${icon('arrow')}</button><div class="summary"><strong>${clients.length} para atender</strong><span>· carteira demonstrativa</span></div><label class="search">${icon('search')}<input id="route-search" placeholder="Buscar cliente" aria-label="Buscar cliente na rota"></label><div class="route-list">${clients.map(c=>`<article class="client" data-client-name="${esc(c.name.toLowerCase())}"><div class="flex between"><button class="client-name" data-action="client" data-client="${esc(c.name)}">${esc(c.name)}</button>${c.recent?badge('Pedido recente','blue'):''}</div><p class="reason">${c.reason}</p>${c.recent?orderContext():c.risk?`<div class="mt">${badge(c.risk,'amber')}</div>`:''}${c.recent&&state.reviewed?`<p class="rule-note">${icon('check')} Pedido antecipado conferido. Cliente mantido na fila.</p>`:''}<div class="actions">${btn('Atender','attend','primary',`data-client="${esc(c.name)}"`)}${btn('Novo pedido','new-order','',`data-client="${esc(c.name)}"`)}</div></article>`).join('')}</div><p class="empty" id="search-empty" hidden>Nenhum cliente com esse nome nesta demonstração.</p>${clients.length?'':`<div class="empty"><h4>Rota demonstrativa registrada</h4><p>Veja os resultados na atividade do dia.</p></div>`}<button class="rowlink" data-screen="oportunidades">${icon('users')}<span>Oportunidades em acompanhamento</span>${icon('arrow')}</button>`}
function contact(){return title('Registrar contato',esc(state.client),btn(icon('close'),'back-route','','aria-label="Voltar à rota"'))+(state.client==='Mercado Jardim'?notice('Pedido #1234 feito ontem. <b>Entrega mantida para hoje.</b>','info')+btn('Pedido antecipado — entrega mantida','order','link full'):'')+`<form id="contact-form"><fieldset><legend>Como você falou com o cliente?</legend>${radio('channel',['Presencial','WhatsApp','Ligação'],state.channel)}</fieldset><fieldset><legend>Qual foi o resultado?</legend>${radio('result',['Já está abastecido','Não respondeu / ausente','Combinou retorno','Problema a resolver'],state.result,true)}</fieldset><div id="result-fields">${resultFields()}</div><label class="field"><span>Observação <span class="muted">· opcional</span></span><textarea name="observation" placeholder="Só o que ajuda no próximo contato"></textarea></label><p id="contact-error" class="error" role="alert" hidden></p><button type="submit" class="btn primary full mt">Salvar contato</button></form><button class="btn link full" data-screen="revisao">Rever acompanhamento deste cliente ${icon('arrow')}</button>`}
function resultFields(){return state.result==='Combinou retorno'?`<label class="field"><span>Quando ficou combinado?</span><input type="date" name="returnDate" value="2026-10-30" min="2026-10-23" required></label><label class="field"><span>O que fazer no retorno?</span><input name="returnSubject" placeholder="Ex.: conferir necessidade de reposição" required></label>`:state.result==='Problema a resolver'?`<label class="field"><span>Qual problema precisa de atenção?</span><input name="problem" placeholder="Ex.: conferir produto recebido" required></label><p class="rule-note">Encaminhar à gestão comercial, com prazo para 26/10. Responsável e prazo são ilustrativos.</p>`:''}
function activity(){const events=[...state.events,{name:'Padaria das Flores',type:'Pedido',text:'Pedido #1233 · R$ 350,00',sub:'Recebido por WhatsApp · lançado por Ana',time:'09:40'},{name:'Café Estação',type:'Tentativa',text:'Responsável ausente',sub:'Nova tentativa combinada para 27/10',time:'09:15'}];return title('Atividade do dia','Sexta, 23 de outubro')+`<div class="tabs"><button data-screen="hoje">Hoje</button><button class="on" data-screen="atividade">Atividade</button><button data-screen="agenda">Agenda</button></div>${notice('Pedido anterior, contato e revisão aparecem separados.')}<div class="timeline">${events.map(e=>`<article class="event"><div class="event-title"><h4>${esc(e.name)}</h4><time>${e.time}</time></div><div class="mt">${badge(e.type,e.type==='Pedido'?'success':e.type==='Revisão da rota'?'blue':'')}</div><p><b>${esc(e.text)}</b></p><p>${esc(e.sub)}</p><details><summary>Ver histórico</summary><p>${e.type==='Revisão da rota'?'Pedido #1234 criado em 22/10. Entrega prevista em 23/10. Conferência registrada sem nova venda ou visita.':`Registro demonstrativo da carteira. ${esc(e.sub)}`}</p></details></article>`).join('')}</div>`}
function revision(){return title('Rever acompanhamento',esc(state.client))+`<form id="revision-form"><fieldset><legend>O que mudou?</legend>${radio('revision',['Pediu uma pausa','Não quer mais contato comercial','Estabelecimento fechou','Precisa de outro vendedor','Possível cadastro duplicado'],state.revision,true)}</fieldset><div id="revision-fields">${revisionFields()}</div><label class="field"><span>Motivo ou contexto</span><textarea name="reason" placeholder="Uma frase para orientar quem acompanhará" required></textarea></label><div class="mt">${notice('O cadastro, os pedidos e o histórico serão mantidos.')}</div><button class="btn primary full mt" type="submit">Salvar revisão</button></form>`}
function revisionFields(){if(state.revision==='Pediu uma pausa')return `<label class="field"><span>Revisar a pausa em</span><input name="reviewDate" type="date" value="2026-11-06" min="2026-10-24" required></label>`;if(state.revision==='Não quer mais contato comercial')return `<p class="rule-note">Não será criado retorno comercial automático. A preferência fica registrada e o histórico permanece disponível.</p>`;return `<p class="rule-note">A solicitação será encaminhada à gestão para ${state.revision==='Precisa de outro vendedor'?'redistribuir a carteira':'conferir o cadastro'}. O cliente mantém um responsável até a conclusão.</p>`}
function agenda(){const list=state.tasks.filter(t=>t.when===state.agenda);return title('Agenda','Cada compromisso tem um próximo passo')+`<div class="filters">${['Atrasados','Hoje','Próximos'].map(s=>`<button data-agenda="${s}" class="${s===state.agenda?'on':''}">${s} · ${state.tasks.filter(t=>t.when===s).length}</button>`).join('')}</div>${list.map(t=>`<article class="task">${badge(t.date,t.when==='Atrasados'?'amber':'')}<h4>${esc(t.name)}</h4><p>${esc(t.text)}</p><p>Responsável: Ana · carteira demonstrativa</p><div class="actions">${btn('Registrar resultado','task-result','primary',`data-task="${t.id}"`)}${btn('Reagendar','reschedule','',`data-task="${t.id}"`)}</div></article>`).join('')||`<div class="empty">${icon('check')}<h4>Nenhum compromisso nesta lista</h4><p>Os próximos retornos continuam nas outras abas.</p></div>`}<button class="rowlink" data-screen="revisao">${icon('pause')}<span>Revisar acompanhamento de um cliente</span>${icon('arrow')}</button>`}
function newLead(){return title('Nova oportunidade','Primeiro, confira se já existe um cadastro')+`<form id="lead-form"><label class="field"><span>Nome do estabelecimento</span><input name="name" id="lead-name" placeholder="Experimente: Mercado Jardim" required autocomplete="off"></label><div id="duplicate"></div><label class="field"><span>WhatsApp ou referência de localização</span><input name="reference" placeholder="Um contato ou endereço para encontrar o local" required></label><fieldset><legend>Como surgiu?</legend>${radio('origin',['Visita','Indicação','WhatsApp'],'Visita')}</fieldset><label class="field"><span>Qual é o próximo passo?</span><input name="nextStep" placeholder="Ex.: conversar com a responsável" required></label><label class="field"><span>Quando?</span><input name="nextDate" type="date" value="2026-10-27" min="2026-10-23" required></label><p class="rule-note">Começa em “A qualificar”. Não entra automaticamente na rota semanal.</p><p class="error" id="lead-error" role="alert" hidden></p><button class="btn primary full mt" type="submit">Salvar oportunidade</button></form>`}
function opportunities(){const extra=state.leadFilter==='A qualificar'?state.leads:[];const examples={'A qualificar':[{name:'Confeitaria Bela Vista',text:'Indicação · identificar a responsável',status:'A qualificar',date:'Contato previsto: 27/10'}],'Em acompanhamento':[{name:'Café Estação',text:'Apresentação de produtos combinada',status:'Em acompanhamento',date:'Próxima ação: 27/10'},{name:'Empório do Bairro',text:'Amostra entregue · aguarda avaliação',status:'Em acompanhamento',date:'Próxima ação: 26/10'}],'Pausadas':[{name:'Lanchonete da Vila',text:'Reforma do estabelecimento',status:'Pausada',date:'Revisar em 06/11'}],'Encerradas':[{name:'Cantina do Parque',text:'Sem interesse neste momento',status:'Encerrada',date:'Histórico preservado'}],'Convertidas':[{name:'Padaria das Flores',text:'Cadastro vinculado · primeira compra realizada',status:'Convertida',date:'Acompanhar a primeira recompra'}]};const list=[...extra,...examples[state.leadFilter]];return title('Oportunidades','Uma oportunidade, um próximo passo',btn(icon('plus'),'new-lead','primary','aria-label="Nova oportunidade"'))+`<div class="filters">${Object.keys(examples).map(s=>`<button data-leads="${s}" class="${state.leadFilter===s?'on':''}">${s}</button>`).join('')}</div><button class="notice mt" data-action="duplicates">${icon('users')}<span class="grow"><b>Conferir possíveis duplicados</b><br>Revisão antes de criar ou vincular</span>${icon('arrow')}</button>${list.map(l=>`<article class="task">${badge(l.status,l.status==='Convertida'?'success':'')}<h4>${esc(l.name)}</h4><p>${esc(l.text)}</p><p><b>${esc(l.date)}</b></p><div class="actions">${btn('Ver oportunidade','lead-detail','',`data-client="${esc(l.name)}"`)}${btn('Registrar','attend','secondary',`data-client="${esc(l.name)}"`)}</div></article>`).join('')}`}
function management(){return title('Acompanhamento comercial','Esta semana · carteira demonstrativa')+`<div class="stats">${[{n:6,l:'Sem próxima ação',k:'next'},{n:state.tasks.filter(t=>t.when==='Atrasados').length,l:'Compromissos vencidos',k:'late'},{n:9,l:'Fora do ciclo de compra',k:'cycle'},{n:7+state.leads.length,l:'Oportunidades a qualificar',k:'leads'}].map(x=>`<button class="stat" data-metric="${x.k}"><strong>${x.n}</strong><span>${x.l}</span></button>`).join('')}</div><h4 class="section-title">Precisam de uma decisão</h4><button class="rowlink" data-action="exception" data-case="Cliente com três adiamentos">${icon('clock')}<span>Cliente com três adiamentos<br><small class="muted">Conferir a abordagem e o próximo passo</small></span>${icon('arrow')}</button><button class="rowlink" data-action="exception" data-case="Cliente aguardando redistribuição">${icon('user')}<span>Cliente aguardando redistribuição<br><small class="muted">Definir quem continuará acompanhando</small></span>${icon('arrow')}</button><button class="rowlink" data-action="duplicates">${icon('users')}<span>Possível cadastro duplicado<br><small class="muted">Conferir antes de vincular</small></span>${icon('arrow')}</button><h4 class="section-title">Carteira e resultados</h4><table class="manager-table"><caption class="sr">Exemplo fictício de comparação por responsável</caption><thead><tr><th>Responsável</th><th>Contatos</th><th>Compradores</th><th>Vencidos</th></tr></thead><tbody><tr><td>Ana</td><td>18</td><td>11</td><td>2</td></tr><tr><td>Bruno</td><td>15</td><td>9</td><td>1</td></tr><tr><td>Carla</td><td>21</td><td>12</td><td>1</td></tr></tbody></table><p class="rule-note">Clientes únicos no período. Compradores não representam, por si só, conversão causada pelo contato. Números ilustrativos.</p>`}
const renderers={hoje:route,contato:contact,atividade:activity,revisao:revision,agenda:agenda,novo:newLead,oportunidades:opportunities,gestao:management};
function render(){const s=screens.find(s=>s.id===state.screen)||screens[0];state.screen=s.id;document.getElementById('page-title').textContent=s.title;document.getElementById('page-subtitle').textContent=s.sub;document.getElementById('screen-nav').innerHTML=screens.map(t=>`<button data-screen="${t.id}" ${t.id===s.id?'aria-current="page"':''}>${icon(t.icon)}${t.label}</button>`).join('');document.getElementById('app').classList.toggle('wide',state.view==='desktop');document.getElementById('app-main').innerHTML=renderers[s.id]();document.getElementById('notes').innerHTML=`<div class="explain"><h3>O que fica mais simples</h3><p>${s.change}</p></div><div class="decision"><strong>${icon('alert')} ${s.id==='hoje'?'Regra confirmada':'Para nossa próxima conversa'}</strong><p>${s.decision}</p></div><p class="try"><b>Experimente nesta tela</b><br>${s.try}</p><p class="small">Demonstração com dados fictícios. As ações valem apenas nesta página.</p>`;document.getElementById('bottomnav').innerHTML=[['hoje','route','Rota'],['agenda','calendar','Agenda'],['oportunidades','users','Oportunidades'],['gestao','chart','Gestão']].map(([id,ic,l])=>`<button data-screen="${id}" class="${id===s.id?'active':''}">${icon(ic)}${l}</button>`).join('');document.getElementById('screen-position').textContent=`${screens.indexOf(s)+1} de ${screens.length} telas`;document.getElementById('previous').innerHTML=icon('back')+'Anterior';document.getElementById('next').innerHTML='Próxima'+icon('arrow');document.getElementById('previous').disabled=screens.indexOf(s)===0;document.getElementById('next').disabled=screens.indexOf(s)===screens.length-1;}
function openDialog(title,body){document.getElementById('dialog-content').innerHTML=`<h3 id="dialog-title">${title}</h3>${body}`;document.getElementById('dialog').showModal()}
function closeDialog(){document.getElementById('dialog').close()}
function recordEvent(e){state.events.unshift({time:'Agora',...e})}
function orderDialog(){openDialog('Pedido antecipado',`<p>Mercado Jardim · pedido #1234</p><div class="kv"><span>Pedido realizado</span><b>Ontem, 22/10</b></div><div class="kv"><span>Valor</span><b>R$ 480,00</b></div><div class="kv"><span>Entrega prevista</span><b>Sexta, 23/10</b></div><div class="kv"><span>Canal</span><b>WhatsApp</b></div><div class="mt">${notice('A entrega permanece na data combinada.','info')}</div><p>Esta demonstração registra a conferência e mantém o cliente na fila. A regra de encerramento do dia ainda será definida.</p>${btn('Registrar pedido antecipado','confirm-early','primary full')}${btn('Fazer novo contato','contact-early','link full')}`)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.screen){nav(b.dataset.screen);return}if(b.dataset.view){state.view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>{x.classList.toggle('selected',x.dataset.view===state.view);x.setAttribute('aria-pressed',x.dataset.view===state.view)});document.getElementById('app').classList.toggle('wide',state.view==='desktop');return}if(b.dataset.agenda){state.agenda=b.dataset.agenda;render();return}if(b.dataset.leads){state.leadFilter=b.dataset.leads;render();return}if(b.dataset.metric){if(b.dataset.metric==='late'){state.agenda='Atrasados';nav('agenda')}else if(b.dataset.metric==='leads'){state.leadFilter='A qualificar';nav('oportunidades')}else openDialog(b.dataset.metric==='cycle'?'Clientes fora do ciclo':'Clientes sem próxima ação',`<p>Exemplo de lista que explica o indicador. Os números do painel são ilustrativos.</p><div class="kv"><b>Padaria Primavera</b><span>Conferir reposição</span></div><div class="kv"><b>Mercearia do Lago</b><span>Definir contato</span></div><div class="actions">${btn('Abrir agenda','goto-agenda','primary')}</div>`);return}
const a=b.dataset.action;if(!a)return;switch(a){case'reset':state=seed();nav('hoje');document.querySelectorAll('[data-view]').forEach(x=>{x.classList.toggle('selected',x.dataset.view==='mobile');x.setAttribute('aria-pressed',x.dataset.view==='mobile')});notify('Demonstração reiniciada.');break;case'previous':case'next':{let i=screens.findIndex(s=>s.id===state.screen)+(a==='next'?1:-1);if(screens[i])nav(screens[i].id);break}case'close-dialog':closeDialog();break;case'order':orderDialog();break;case'confirm-early':if(!state.reviewed){recordEvent({name:'Mercado Jardim',type:'Revisão da rota',text:'Pedido antecipado — entrega mantida',sub:'Pedido de 22/10 · conferência sem nova visita ou venda'});state.reviewed=true}closeDialog();nav('hoje');notify('Pedido conferido. Entrega mantida e cliente continua na fila.');break;case'contact-early':closeDialog();nav('contato','Mercado Jardim');break;case'attend':state.result='';state.currentTask=null;nav('contato',b.dataset.client);break;case'back-route':nav('hoje');break;case'new-lead':nav('novo');break;case'goto-agenda':closeDialog();nav('agenda');break;case'client':case'lead-detail':openDialog(esc(b.dataset.client),`<p>Ficha demonstrativa · responsável: Ana</p><div class="kv"><span>Situação</span><b>Em acompanhamento</b></div><div class="kv"><span>Próximo passo</span><b>Conferir necessidade</b></div><p>Cadastro completo, histórico e preferências ficam aqui, fora do cartão principal da rota.</p>${btn('Rever acompanhamento','review-from-dialog','primary full',`data-client="${esc(b.dataset.client)}"`)}`);break;case'review-from-dialog':closeDialog();nav('revisao',b.dataset.client);break;case'new-order':state.client=b.dataset.client;openDialog('Novo pedido',`<p>${esc(state.client)} · exemplo de pedido para demonstrar o fluxo.</p><div class="kv"><span>Pedido demonstrativo</span><b>R$ 350,00</b></div><p>Abrir esta tela não resolve o atendimento. Somente o botão abaixo simula o pedido salvo.</p>${btn('Simular pedido salvo','save-order','primary full')}`);break;case'save-order':recordEvent({name:state.client,type:'Pedido',text:'Pedido demonstrativo · R$ 350,00',sub:'Pedido salvo nesta simulação'});state.done.push(state.client);closeDialog();nav('atividade');notify('Pedido simulado. Nenhuma venda real foi criada.');break;case'task-result':{const t=state.tasks.find(t=>t.id===Number(b.dataset.task));state.currentTask=t.id;state.result='';nav('contato',t.name);break}case'reschedule':{const t=state.tasks.find(t=>t.id===Number(b.dataset.task));openDialog('Reagendar compromisso',`<p>${esc(t.name)} · ${esc(t.text)}</p><form id="reschedule-form" data-task="${t.id}"><label class="field"><span>Nova data</span><input type="date" name="date" value="2026-10-27" min="2026-10-24" required></label><label class="field"><span>Por que ficou para depois?</span><input name="reason" placeholder="Ex.: responsável pediu nova data" required></label><button type="submit" class="btn primary full mt">Salvar nova data</button></form>`);break}case'duplicates':openDialog('Conferir possível duplicidade',`<p>Exemplo fictício de dois registros com identificação semelhante. Confira antes de vincular.</p><div class="kv"><b>Mercado Jardim</b><span>Cliente · Centro</span></div><div class="kv"><b>Merc. Jardim</b><span>Lead · Centro</span></div><p>Uma coincidência não é uma confirmação. Pedidos e histórico devem ser preservados.</p>${btn('Encaminhar para revisão','review-duplicate','primary full')}`);break;case'review-duplicate':closeDialog();notify('Revisão registrada apenas nesta demonstração. Nenhum cadastro foi unido.');break;case'exception':openDialog(esc(b.dataset.case),`<p>Mercado Jardim · exemplo fictício</p><p>Responsável atual: Ana. Conferir o motivo e combinar um próximo passo antes de encerrar a pendência.</p>${btn('Rever acompanhamento','review-from-dialog','primary full','data-client="Mercado Jardim"')}`);break;case'existing-client':openDialog('Cadastro já existente',`<p>Mercado Jardim · cliente em acompanhamento</p><div class="kv"><span>Responsável</span><b>Ana</b></div><div class="kv"><span>Próximo contato</span><b>23/10</b></div>${btn('Ir para a rota','existing-route','primary full')}`);break;case'existing-route':closeDialog();nav('hoje');break;case'different-lead':b.closest('.duplicate-panel').dataset.confirmed='true';b.closest('.duplicate-panel').innerHTML=notice('Você informou que é outro estabelecimento. Confira a identificação antes de salvar.');break;}});
document.addEventListener('change',e=>{if(e.target.name==='channel')state.channel=e.target.value;if(e.target.name==='result'){state.result=e.target.value;document.getElementById('result-fields').innerHTML=resultFields()}if(e.target.name==='revision'){state.revision=e.target.value;document.getElementById('revision-fields').innerHTML=revisionFields()}});
document.addEventListener('input',e=>{if(e.target.id==='route-search'){const q=e.target.value.toLocaleLowerCase('pt-BR');let visible=0;document.querySelectorAll('[data-client-name]').forEach(c=>{c.hidden=!c.dataset.clientName.includes(q);if(!c.hidden)visible++});document.getElementById('search-empty').hidden=visible>0}if(e.target.id==='lead-name'){const match=e.target.value.toLocaleLowerCase('pt-BR').includes('jardim');document.getElementById('duplicate').innerHTML=match?`<div class="duplicate-panel mt"><div class="notice">${icon('users')}<span><b>Possível cadastro existente</b><br>Mercado Jardim · cliente do Centro</span></div><div class="actions">${btn('Abrir cadastro','existing-client','secondary')}${btn('É outro local','different-lead')}</div></div>`:''}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=new FormData(f);if(f.id==='contact-form'){if(!state.result){const er=document.getElementById('contact-error');er.textContent='Escolha o resultado do contato para continuar.';er.hidden=false;return}let sub=state.result==='Não respondeu / ausente'?'Tentativa registrada; não representa recusa.':'Próximo contato na rotina da carteira.';if(state.result==='Combinou retorno'){const date=d.get('returnDate');sub=`Retorno em ${date.split('-').reverse().join('/')}: ${d.get('returnSubject')}`;state.tasks.push({id:Date.now(),name:state.client,text:d.get('returnSubject'),when:date==='2026-10-23'?'Hoje':'Próximos',date:date.split('-').reverse().join('/')})}if(state.result==='Problema a resolver'){sub='Encaminhado à gestão para 26/10.';state.tasks.push({id:Date.now(),name:state.client,text:d.get('problem'),when:'Próximos',date:'26/10 · gestão comercial'})}recordEvent({name:state.client,type:state.result==='Não respondeu / ausente'?'Tentativa':'Contato',text:`${state.channel} · ${state.result}`,sub});state.done.push(state.client);if(state.currentTask){state.tasks=state.tasks.filter(t=>t.id!==state.currentTask);state.currentTask=null}nav('atividade');notify('Resultado registrado na demonstração.')}else if(f.id==='revision-form'){const pause=state.revision==='Pediu uma pausa',noContact=state.revision==='Não quer mais contato comercial';if(pause||noContact){state.tasks=state.tasks.filter(t=>t.name!==state.client);state.currentTask=null}if(pause){const date=d.get('reviewDate');state.tasks.push({id:Date.now(),name:state.client,text:'Revisar pausa: '+d.get('reason'),when:'Próximos',date:date.split('-').reverse().join('/')})}if(pause||noContact)state.done.push(state.client);recordEvent({name:state.client,type:'Revisão da rota',text:state.revision,sub:pause?'Revisão da pausa agendada; histórico preservado.':noContact?'Preferência registrada, sem retorno comercial automático.':'Solicitação de conferência enviada à gestão na simulação.'});nav('atividade');notify('Revisão simulada. O cadastro real permanece inalterado.')}else if(f.id==='lead-form'){const dup=document.querySelector('.duplicate-panel');if(dup&&dup.dataset.confirmed!=='true'){const er=document.getElementById('lead-error');er.hidden=false;er.textContent='Confira o cadastro encontrado ou confirme que é outro estabelecimento.';return}state.leads.unshift({name:d.get('name'),text:d.get('origin')+' · '+d.get('nextStep'),status:'A qualificar',date:'Próxima ação: '+d.get('nextDate').split('-').reverse().join('/')});state.leadFilter='A qualificar';nav('oportunidades');notify('Oportunidade criada apenas nesta demonstração.')}else if(f.id==='reschedule-form'){const t=state.tasks.find(t=>t.id===Number(f.dataset.task));t.when='Próximos';t.date=d.get('date').split('-').reverse().join('/');t.text+=' · '+d.get('reason');closeDialog();render();notify('Compromisso reagendado na demonstração.')}});
document.getElementById('mobile-menu').addEventListener('click',e=>{const open=document.getElementById('screen-nav').classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',open)});
document.getElementById('mobile-view').innerHTML=icon('mobile')+'Celular';document.getElementById('desktop-view').innerHTML=icon('desktop')+'Computador';document.getElementById('dialog-close').innerHTML=icon('close');
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(screens.some(s=>s.id===id)&&id!==state.screen){state.screen=id;render()}});
if(screens.some(s=>s.id===location.hash.slice(1)))state.screen=location.hash.slice(1);render();
</script>
